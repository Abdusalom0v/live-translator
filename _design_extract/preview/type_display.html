<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--color-bg); color: var(--fg-1); font-family: var(--font-sans); }
  .card { padding: 24px; display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; align-items: baseline; gap: 16px; border-bottom: 1px solid var(--color-divider); padding-bottom: 12px; }
  .row:last-child { border-bottom: 0; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); width: 130px; flex-shrink: 0; }
  .meta b { color: var(--fg-1); font-weight: 600; }
</style>
</head><body>
<div class="card">
  <div class="row">
    <div class="meta"><b>Display</b><br>64 / 1.15 / 700</div>
    <div class="lt-display">LiveTranslate</div>
  </div>
  <div class="row">
    <div class="meta"><b>H1</b><br>38 / 1.15 / 700</div>
    <div class="lt-h1">Real-time tarjimon</div>
  </div>
  <div class="row">
    <div class="meta"><b>H2</b><br>30 / 1.30 / 600</div>
    <div class="lt-h2">Mikrofon kerak</div>
  </div>
  <div class="row">
    <div class="meta"><b>H3</b><br>24 / 1.30 / 600</div>
    <div class="lt-h3">Tillarni tanlang</div>
  </div>
</div>
</body></html>
