<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../ui_kits/app/app.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--color-bg); color: var(--fg-1); font-family: var(--font-sans); }
  .card {
    padding: 28px 24px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px 14px;
    align-items: start;
  }
  .item { text-align: center; }
  .item .btnwrap { display: grid; place-items: center; min-height: 60px; }
  .lbl {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--fg-3);
    display: block;
    text-align: center;
    margin-top: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .meta {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--fg-4);
    margin-top: 2px;
    letter-spacing: 0.04em;
  }

  /* ---------- Primary: idle, with hover glow pulse to demonstrate ---------- */
  .lt-btn { transition:
      background var(--dur-fast) var(--ease-out),
      box-shadow var(--dur-base) var(--ease-out),
      transform var(--dur-fast) var(--ease-out);
  }
  .lt-btn:hover { transform: translateY(-1px); }
  .lt-btn:active { transform: translateY(0) scale(0.98); }

  /* Forced "hover" demo — pulsing glow */
  .demo-hover {
    background: var(--color-accent-hover) !important;
    animation: demo-glow 2.4s var(--ease-in-out) infinite;
  }
  @keyframes demo-glow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(127,119,221,0.0), 0 8px 24px rgba(8,8,30,0.45); }
    50%      { box-shadow: 0 0 28px 4px rgba(127,119,221,0.55), 0 8px 24px rgba(8,8,30,0.45); }
  }

  /* Forced "press" demo */
  .demo-press {
    background: var(--color-accent-press) !important;
    animation: demo-press 1.4s var(--ease-in-out) infinite;
  }
  @keyframes demo-press {
    0%, 40%, 100% { transform: scale(1); }
    50%, 70%      { transform: scale(0.96); }
  }

  /* Loading: text fades to "..." dots */
  .demo-loading {
    pointer-events: none;
    background: var(--color-accent-press) !important;
  }
  .demo-loading .dots {
    display: inline-flex; gap: 4px; align-items: center; margin-left: 8px;
  }
  .demo-loading .dots i {
    width: 6px; height: 6px; border-radius: 50%;
    background: #fff; display: inline-block;
    animation: ltb-dot 1.2s var(--ease-in-out) infinite both;
  }
  .demo-loading .dots i:nth-child(2) { animation-delay: 0.15s; }
  .demo-loading .dots i:nth-child(3) { animation-delay: 0.30s; }
  @keyframes ltb-dot {
    0%, 80%, 100% { transform: scale(0.5); opacity: 0.45; }
    40%           { transform: scale(1);   opacity: 1; }
  }

  /* Success: morphs green with check */
  .demo-success {
    background: var(--color-success) !important;
    animation: demo-success-pop 1.8s var(--ease-out);
    animation-iteration-count: infinite;
  }
  @keyframes demo-success-pop {
    0%, 30%   { background: var(--color-accent); }
    35%       { background: var(--color-success); transform: scale(1.06); }
    45%       { transform: scale(1); }
    100%      { background: var(--color-success); }
  }
  .check {
    display: inline-block; width: 18px; height: 18px;
    vertical-align: middle; margin-right: 6px;
  }
  .check path {
    stroke-dasharray: 24;
    stroke-dashoffset: 24;
    animation: draw-check 1.8s var(--ease-out) infinite both;
  }
  @keyframes draw-check {
    0%, 30%   { stroke-dashoffset: 24; }
    50%, 100% { stroke-dashoffset: 0; }
  }

  /* Ghost: subtle border-shine demonstration */
  .demo-ghost {
    position: relative; overflow: hidden;
  }
  .demo-ghost::after {
    content: '';
    position: absolute; top: 0; left: -60%;
    width: 50%; height: 100%;
    background: linear-gradient(110deg,
      transparent 0%,
      rgba(127,119,221,0.18) 40%,
      rgba(127,119,221,0.28) 50%,
      rgba(127,119,221,0.18) 60%,
      transparent 100%);
    animation: shine 3s var(--ease-in-out) infinite;
  }
  @keyframes shine {
    0%   { left: -60%; }
    60%  { left: 110%; }
    100% { left: 110%; }
  }

  /* Disabled */
  .demo-disabled { opacity: 0.5; cursor: not-allowed; }

  /* Control chip: active dot pulse */
  .demo-chip-dot {
    width: 8px; height: 8px; border-radius: 999px;
    background: currentColor;
    animation: lt-pulse 1.4s var(--ease-in-out) infinite;
    box-shadow: 0 0 8px currentColor;
  }

  /* Active control chip: subtle background breathing */
  .demo-control-active {
    animation: chip-breathe 2.6s var(--ease-in-out) infinite;
  }
  @keyframes chip-breathe {
    0%, 100% { background: var(--color-accent-soft); box-shadow: 0 0 0 0 rgba(127,119,221,0); }
    50%      { background: rgba(127,119,221,0.26);  box-shadow: 0 0 14px 0 rgba(127,119,221,0.35); }
  }

  /* Icon-only spinner */
  .spinbtn {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--color-card);
    border: 1px solid var(--color-border-strong);
    display: grid; place-items: center;
    color: var(--color-accent);
    position: relative;
  }
  .spinbtn::before {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, transparent 0deg, var(--color-accent) 90deg, transparent 200deg);
    animation: lt-spin 1.2s linear infinite;
    z-index: 0;
  }
  .spinbtn::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: var(--color-bg);
    z-index: 1;
  }
  .spinbtn svg { position: relative; z-index: 2; }
</style>
</head><body>
<div class="card">

  <!-- Row 1 -->
  <div class="item">
    <div class="btnwrap"><button class="lt-btn">Boshlash</button></div>
    <span class="lbl">Primary</span>
    <div class="meta">idle</div>
  </div>

  <div class="item">
    <div class="btnwrap"><button class="lt-btn demo-hover">Boshlash</button></div>
    <span class="lbl">Hover</span>
    <div class="meta">+ glow pulse · 2.4s</div>
  </div>

  <div class="item">
    <div class="btnwrap"><button class="lt-btn demo-press">Boshlash</button></div>
    <span class="lbl">Press</span>
    <div class="meta">scale 0.96</div>
  </div>

  <div class="item">
    <div class="btnwrap">
      <button class="lt-btn demo-loading">
        Yuklanmoqda
        <span class="dots"><i></i><i></i><i></i></span>
      </button>
    </div>
    <span class="lbl">Loading</span>
    <div class="meta">3-dot · 1.2s loop</div>
  </div>

  <!-- Row 2 -->
  <div class="item">
    <div class="btnwrap">
      <button class="lt-btn demo-success">
        <svg class="check" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12.5l4 4 10-10"/>
        </svg>
        Saqlandi
      </button>
    </div>
    <span class="lbl">Success</span>
    <div class="meta">color-morph + draw</div>
  </div>

  <div class="item">
    <div class="btnwrap"><button class="lt-btn lt-btn--ghost demo-ghost">Keyinroq</button></div>
    <span class="lbl">Ghost</span>
    <div class="meta">border shine · 3s</div>
  </div>

  <div class="item">
    <div class="btnwrap"><button class="lt-btn demo-disabled" disabled>Boshlash</button></div>
    <span class="lbl">Disabled</span>
    <div class="meta">opacity 0.5</div>
  </div>

  <div class="item">
    <div class="btnwrap">
      <button class="spinbtn" aria-label="Processing">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/>
        </svg>
      </button>
    </div>
    <span class="lbl">Icon · Processing</span>
    <div class="meta">conic spin · 1.2s</div>
  </div>

  <!-- Row 3 — control chips -->
  <div class="item" style="grid-column: span 2">
    <div class="btnwrap" style="gap: 12px; display: flex; justify-content: center">
      <button class="lt-control-btn">
        <span style="display:inline-block;width:8px;height:8px;border-radius:999px;background:currentColor"></span>
        Built-in mic
      </button>
      <button class="lt-control-btn">
        Voice off
      </button>
    </div>
    <span class="lbl">Control chip · idle</span>
  </div>

  <div class="item" style="grid-column: span 2">
    <div class="btnwrap" style="gap: 12px; display: flex; justify-content: center">
      <button class="lt-control-btn lt-control-btn--active demo-control-active">
        <span class="demo-chip-dot"></span>
        Auto-scroll
      </button>
      <button class="lt-control-btn lt-control-btn--active demo-control-active" style="animation-delay: 1.3s">
        Recording
      </button>
    </div>
    <span class="lbl">Control chip · active</span>
  </div>

</div>
</body></html>
