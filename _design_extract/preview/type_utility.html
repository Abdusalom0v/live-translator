<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--color-bg); color: var(--fg-1); font-family: var(--font-sans); }
  .card { padding: 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
  .col { display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; align-items: baseline; gap: 14px; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); min-width: 90px; }
  .meta b { color: var(--fg-1); font-weight: 600; }
</style>
</head><body>
<div class="card">
  <div class="col">
    <div class="row"><div class="meta"><b>Label</b></div>             <span class="lt-label">Translation</span></div>
    <div class="row"><div class="meta"><b>Caption</b></div>           <span class="lt-caption">Nothing is sent without your permission.</span></div>
    <div class="row"><div class="meta"><b>Timestamp</b></div>         <span class="lt-timestamp">14:23</span></div>
    <div class="row"><div class="meta"><b>Mono</b></div>              <span class="lt-mono">~1.2s · 4 chunks · 28s</span></div>
  </div>
  <div class="col">
    <div class="row"><div class="meta"><b>Pill</b></div>
      <span class="lt-label" style="background:rgba(127,119,221,0.16); color:#7F77DD; padding:2px 8px; border-radius:999px; letter-spacing:0.04em;">BETA</span>
    </div>
    <div class="row"><div class="meta"><b>UI button</b></div>          <span class="lt-button">Boshlash</span></div>
    <div class="row"><div class="meta"><b>fw-medium</b></div>         <span style="font-weight:500">Yozilmoqda</span></div>
    <div class="row"><div class="meta"><b>fw-semibold</b></div>       <span style="font-weight:600">Saqlash</span></div>
  </div>
</div>
</body></html>
