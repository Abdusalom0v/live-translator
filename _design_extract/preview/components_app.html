<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../ui_kits/app/app.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--color-bg); color: var(--fg-1); font-family: var(--font-sans); }

  .card {
    padding: 22px;
    display: grid;
    grid-template-columns: 1.85fr 1fr;
    gap: 22px;
    align-items: stretch;
  }
  .strip {
    grid-column: 1 / -1;
    display: flex; align-items: center; justify-content: space-between;
  }
  .strip .lbl {
    font-family: var(--font-mono); font-size: 10px; color: var(--fg-3);
    letter-spacing: 0.12em; text-transform: uppercase;
  }
  .strip .key {
    display: flex; gap: 14px; align-items: center;
    font-family: var(--font-mono); font-size: 10px; color: var(--fg-3);
  }

  /* ----------- Desktop frame ----------- */
  .desktop {
    position: relative;
    border: 1px solid var(--color-border);
    border-radius: 16px;
    overflow: hidden;
    background: var(--color-bg);
    min-height: 580px;
    box-shadow: 0 18px 40px rgba(8,8,30,0.45);
  }
  .desktop .chrome {
    height: 28px;
    background: rgba(20, 20, 46, 0.85);
    border-bottom: 1px solid var(--color-divider);
    display: flex; align-items: center;
    padding: 0 12px; gap: 6px;
  }
  .desktop .chrome .dot { width: 10px; height: 10px; border-radius: 50%; }
  .desktop .chrome .url {
    margin-left: 16px;
    font-family: var(--font-mono); font-size: 10px;
    color: var(--fg-3);
    padding: 2px 10px;
    border-radius: 999px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--color-border);
  }
  .desktop iframe { border: 0; width: 100%; height: calc(100% - 28px); display: block; }
  .desktop .badge, .phone-cell .badge {
    position: absolute; bottom: 12px; left: 14px;
    font-family: var(--font-mono); font-size: 10px;
    color: rgba(245,245,247,0.65);
    letter-spacing: 0.08em; text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(30,30,63,0.65);
    border: 1px solid var(--color-border);
    backdrop-filter: blur(10px);
    pointer-events: none;
  }

  /* ----------- Phone cell ----------- */
  .phone-cell {
    position: relative;
    border: 1px solid var(--color-border);
    border-radius: 16px;
    padding: 28px 0 18px;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    background:
      radial-gradient(80% 60% at 50% 15%, rgba(127,119,221,0.16), transparent 70%),
      var(--color-card);
    min-height: 580px;
    overflow: hidden;
  }

  /* Phone bezel */
  .phone {
    width: 300px;
    height: 600px;
    flex-shrink: 0;
    border-radius: 44px;
    background: #0a0a1f;
    padding: 10px;
    box-shadow:
      0 30px 60px rgba(0,0,0,0.55),
      0 0 0 1px rgba(127,119,221,0.20),
      inset 0 0 0 2px #1c1c33;
    position: relative;
  }
  .phone__notch {
    position: absolute;
    top: 18px; left: 50%; transform: translateX(-50%);
    width: 96px; height: 26px;
    background: #000;
    border-radius: 999px;
    z-index: 10;
  }
  .phone__screen {
    width: 100%; height: 100%;
    border-radius: 34px;
    overflow: hidden;
    background: var(--color-bg);
    position: relative;
  }
  .phone__screen iframe {
    border: 0;
    width: 100%; height: 100%;
    display: block;
  }

  .phone-meta {
    text-align: center;
    color: var(--fg-3);
    font-family: var(--font-mono); font-size: 10px;
    letter-spacing: 0.10em; text-transform: uppercase;
    line-height: 1.6;
  }
  .phone-meta b { color: var(--fg-1); font-weight: 600; }
</style>
</head><body>
<div class="card">

  <div class="strip">
    <span class="lbl">Full app · desktop &amp; mobile</span>
    <span class="key">
      <span>1280 · two panels</span>
      <span style="color: var(--fg-4)">·</span>
      <span>360 · tabs &amp; stacked controls</span>
    </span>
  </div>

  <!-- Desktop -->
  <div class="desktop">
    <div class="chrome">
      <span class="dot" style="background:#FF5F57"></span>
      <span class="dot" style="background:#FEBC2E"></span>
      <span class="dot" style="background:#28C840"></span>
      <span class="url">livetranslate.app</span>
    </div>
    <iframe src="../ui_kits/app/index.html" title="LiveTranslate · desktop"></iframe>
    <span class="badge">Desktop · click mic to cycle states</span>
  </div>

  <!-- Phone -->
  <div class="phone-cell">
    <div class="phone">
      <div class="phone__notch"></div>
      <div class="phone__screen">
        <iframe src="mobile_app.html" title="LiveTranslate · mobile"></iframe>
      </div>
    </div>
    <div class="phone-meta">
      <b>iPhone 14</b> · 390 × 844<br>
      Tab-based transcript · larger mic
    </div>
  </div>

</div>
</body></html>
