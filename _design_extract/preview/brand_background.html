<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--color-bg); color: var(--fg-1); font-family: var(--font-sans); height: 100%; overflow: hidden; }
  .stage { position: relative; width: 100%; height: 320px; overflow: hidden; }
  .orb { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.30; }
  .v1 { width: 320px; height: 320px; background: #7F77DD; top: -40px; left: -40px;  animation: o1 22s ease-in-out infinite; }
  .v2 { width: 260px; height: 260px; background: #1D9E75; bottom: -50px; right: -20px;animation: o2 26s ease-in-out infinite; }
  .v3 { width: 200px; height: 200px; background: #5BA8E0; top: 30%; right: 30%;       animation: o3 24s ease-in-out infinite; opacity: 0.22; }
  @keyframes o1 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(60px,30px) scale(1.05)} }
  @keyframes o2 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(-50px,-30px) scale(1.1)} }
  @keyframes o3 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(40px,-40px) scale(0.95)} }
  .grain { position:absolute; inset:0; background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 3px 3px; mix-blend-mode: overlay; opacity: 0.5; }
  .caption {
    position: absolute; bottom: 16px; left: 16px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--fg-2);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    background: rgba(30,30,63,0.6);
    padding: 4px 10px; border-radius: 999px;
    backdrop-filter: blur(8px);
    border: 1px solid var(--color-border);
  }
</style>
</head><body>
<div class="stage">
  <div class="orb v1"></div>
  <div class="orb v2"></div>
  <div class="orb v3"></div>
  <div class="grain"></div>
  <div class="caption">AnimatedBackground · 4 orbs · 80px blur · 15–30% opacity</div>
</div>
</body></html>
