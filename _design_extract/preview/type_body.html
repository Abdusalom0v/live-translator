<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--color-bg); color: var(--fg-1); font-family: var(--font-sans); }
  .card { padding: 24px; display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; align-items: baseline; gap: 16px; border-bottom: 1px solid var(--color-divider); padding-bottom: 12px; }
  .row:last-child { border-bottom: 0; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); width: 130px; flex-shrink: 0; }
  .meta b { color: var(--fg-1); font-weight: 600; }
</style>
</head><body>
<div class="card">
  <div class="row">
    <div class="meta"><b>Body</b><br>16 / 1.50 / 400</div>
    <div class="lt-body">The green pigment is called chlorophyll.</div>
  </div>
  <div class="row">
    <div class="meta"><b>Transcript</b><br>16 / 1.60 / 400</div>
    <div class="lt-transcript">Yashil pigment xlorofil deb ataladi. U quyosh nurini yutadi.</div>
  </div>
  <div class="row">
    <div class="meta"><b>Transcript LG</b><br>20 / 1.60 / 500<br>(projector)</div>
    <div class="lt-transcript-lg">Bugun fotosintez haqida gaplashamiz.</div>
  </div>
  <div class="row">
    <div class="meta"><b>Body-sm</b><br>14 / 1.50</div>
    <div class="lt-body-sm">Built-in mic · Voice off · Auto-scroll</div>
  </div>
</div>
</body></html>
