<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../ui_kits/app/app.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--color-bg); color: var(--fg-1); font-family: var(--font-sans); }
  .card {
    padding: 24px;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 14px;
  }
  .tile {
    position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    padding: 22px 12px 16px;
    background: var(--color-card);
    border: 1px solid var(--color-border);
    border-radius: 14px;
    cursor: pointer;
    transition:
      background var(--dur-fast) var(--ease-out),
      border-color var(--dur-fast) var(--ease-out),
      transform var(--dur-fast) var(--ease-out);
    overflow: hidden;
  }
  .tile:hover {
    background: var(--color-card-hover);
    border-color: var(--color-border-strong);
    transform: translateY(-2px);
  }
  .tile:active { transform: translateY(0) scale(0.98); }

  .glow {
    position: absolute;
    inset: -1px;
    border-radius: inherit;
    opacity: 0;
    pointer-events: none;
    background: radial-gradient(140px 80px at 50% 30%, rgba(127,119,221,0.35), transparent 70%);
    transition: opacity var(--dur-base) var(--ease-out);
  }
  .tile:hover .glow { opacity: 1; }

  .icon-wrap {
    width: 44px; height: 44px;
    display: grid; place-items: center;
    color: var(--fg-1);
    position: relative;
  }
  .icon-wrap svg { width: 28px; height: 28px; display: block; transition: color var(--dur-fast) var(--ease-out); }
  .tile:hover .icon-wrap svg { color: var(--color-accent); }
  .tile:active .icon-wrap svg { color: var(--color-accent-press); }

  .lbl {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--fg-1);
  }
  .meta {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--fg-3);
    letter-spacing: 0.06em;
    text-align: center;
  }

  /* "Try hover" hint */
  .hint {
    grid-column: 1 / -1;
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--fg-3);
    text-align: center;
    margin-bottom: -4px;
  }
  .hint b { color: var(--color-accent); }

  /* ===========================================================
     PER-ICON HOVER / ACTIVE ANIMATIONS
     =========================================================== */

  /* MIC — pulses outward on hover; ring ripples */
  .mic-ring {
    position: absolute; inset: 0;
    border-radius: 50%;
    border: 2px solid var(--color-accent);
    opacity: 0; pointer-events: none;
  }
  .tile:hover .anim-mic svg     { animation: pulse 1.4s var(--ease-in-out) infinite; }
  .tile:hover .anim-mic .mic-ring { animation: ripple 1.4s var(--ease-out) infinite; }
  @keyframes pulse  { 0%,100%{transform:scale(1);} 50%{transform:scale(1.12);} }
  @keyframes ripple { 0%{transform:scale(0.6);opacity:0.7;} 100%{transform:scale(1.8);opacity:0;} }

  /* VOLUME — waves on hover (the arc paths) */
  .anim-vol svg .arc { stroke-dasharray: 14; stroke-dashoffset: 0; }
  .tile:hover .anim-vol svg .arc1 { animation: wave 1.4s var(--ease-in-out) infinite; }
  .tile:hover .anim-vol svg .arc2 { animation: wave 1.4s var(--ease-in-out) infinite; animation-delay: 0.25s; }
  @keyframes wave {
    0%, 100% { opacity: 1; transform: translateX(0); }
    50%      { opacity: 0.4; transform: translateX(-1.5px); }
  }

  /* HEADPHONES — gentle bounce */
  .tile:hover .anim-hp svg { animation: bounce 1s var(--ease-in-out) infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-3px);} }

  /* SWAP — rotate 180° on hover */
  .anim-swap svg { transition: transform var(--dur-base) var(--ease-out); }
  .tile:hover .anim-swap svg  { transform: rotate(180deg); }
  .tile:active .anim-swap svg { transform: rotate(180deg) scale(1.15); }

  /* SAVE — downward nudge + check tick on hover */
  .anim-save svg { transition: transform var(--dur-base) var(--ease-out); }
  .tile:hover .anim-save svg { transform: translateY(2px); }
  .save-check {
    position: absolute; right: 4px; bottom: 4px;
    width: 16px; height: 16px;
    background: var(--color-success);
    border-radius: 50%;
    display: grid; place-items: center;
    transform: scale(0); opacity: 0;
    transition: all var(--dur-base) var(--ease-bounce);
  }
  .save-check svg { width: 10px; height: 10px; }
  .tile:hover .save-check { transform: scale(1); opacity: 1; }

  /* COPY — clone shifts, glow */
  .anim-copy .front { transition: transform var(--dur-base) var(--ease-out); }
  .anim-copy .back  {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    color: var(--color-accent);
    opacity: 0;
    transition: opacity var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-out);
  }
  .tile:hover .anim-copy .front { transform: translate(-4px, -4px); }
  .tile:hover .anim-copy .back  { opacity: 1; transform: translate(4px, 4px); }

  /* HISTORY — clock hand spin */
  .tile:hover .anim-hist svg { animation: spin 2s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* SETTINGS — slow gear rotation */
  .tile:hover .anim-set svg { animation: spinSlow 4s linear infinite; }
  @keyframes spinSlow { to { transform: rotate(360deg); } }

  /* SPARKLES — twinkle on hover */
  .tile:hover .anim-spark svg { animation: twinkle 1.2s var(--ease-in-out) infinite; }
  @keyframes twinkle {
    0%, 100% { transform: scale(1)   rotate(0);   opacity: 1; }
    50%      { transform: scale(1.2) rotate(15deg); opacity: 0.85; }
  }

  /* SEARCH — magnifier nudge */
  .tile:hover .anim-search svg { animation: nudge 1.2s var(--ease-in-out) infinite; }
  @keyframes nudge {
    0%, 100% { transform: translate(0, 0); }
    25%      { transform: translate(-2px, -1px); }
    50%      { transform: translate(2px, 0); }
    75%      { transform: translate(0, 1px); }
  }

  /* Always-on demo highlight on one tile to draw the eye */
  .tile--demo { animation: demo-breathe 3s ease-in-out infinite; }
  @keyframes demo-breathe {
    0%, 100% { box-shadow: 0 0 0 0 rgba(127,119,221,0); border-color: var(--color-border-strong); }
    50%      { box-shadow: 0 0 24px 2px rgba(127,119,221,0.35); border-color: var(--color-accent); }
  }
  .tile--demo .icon-wrap svg { color: var(--color-accent); }
  .tile--demo .anim-mic svg { animation: pulse 1.4s var(--ease-in-out) infinite; }
  .tile--demo .anim-mic .mic-ring { animation: ripple 1.4s var(--ease-out) infinite; }
</style>
</head><body>

<div class="card">
  <div class="hint">Hover yoki bosing — har bir icon o'z animatsiyasini ko'rsatadi · <b>mic</b> tile demo holatda</div>

  <!-- MIC (auto-demo) -->
  <div class="tile tile--demo">
    <div class="glow"></div>
    <div class="icon-wrap anim-mic">
      <span class="mic-ring"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="2" width="6" height="12" rx="3"/>
        <path d="M5 10v2a7 7 0 0 0 14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="22"/>
        <line x1="8"  y1="22" x2="16" y2="22"/>
      </svg>
    </div>
    <span class="lbl">mic</span>
    <span class="meta">pulse + ripple</span>
  </div>

  <!-- VOLUME -->
  <div class="tile">
    <div class="glow"></div>
    <div class="icon-wrap anim-vol">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <path class="arc arc1" d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
        <path class="arc arc2" d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
      </svg>
    </div>
    <span class="lbl">volume</span>
    <span class="meta">arcs ripple</span>
  </div>

  <!-- HEADPHONES -->
  <div class="tile">
    <div class="glow"></div>
    <div class="icon-wrap anim-hp">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 18v-6a9 9 0 0 1 18 0v6"/>
        <path d="M21 19a2 2 0 0 1-2 2h-1v-7h3v5ZM3 19a2 2 0 0 0 2 2h1v-7H3v5Z"/>
      </svg>
    </div>
    <span class="lbl">headphones</span>
    <span class="meta">bounce 1s</span>
  </div>

  <!-- SWAP -->
  <div class="tile">
    <div class="glow"></div>
    <div class="icon-wrap anim-swap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 16V4M7 4 3 8M7 4l4 4"/>
        <path d="M17 8v12M17 20l4-4M17 20l-4-4"/>
      </svg>
    </div>
    <span class="lbl">swap</span>
    <span class="meta">rotate 180°</span>
  </div>

  <!-- SAVE -->
  <div class="tile">
    <div class="glow"></div>
    <div class="icon-wrap anim-save">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/>
        <polyline points="17 21 17 13 7 13 7 21"/>
        <polyline points="7 3 7 8 15 8"/>
      </svg>
      <span class="save-check">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12.5l4 4 10-10"/>
        </svg>
      </span>
    </div>
    <span class="lbl">save</span>
    <span class="meta">nudge + ✓ pop</span>
  </div>

  <!-- COPY -->
  <div class="tile">
    <div class="glow"></div>
    <div class="icon-wrap anim-copy">
      <span class="front" style="display:grid; place-items:center; width:100%; height:100%">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2"/>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
      </span>
      <span class="back">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2"/>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
      </span>
    </div>
    <span class="lbl">copy</span>
    <span class="meta">stack offset</span>
  </div>

  <!-- HISTORY -->
  <div class="tile">
    <div class="glow"></div>
    <div class="icon-wrap anim-hist">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/>
        <path d="M3 3v5h5"/>
        <path d="M12 7v5l3 2"/>
      </svg>
    </div>
    <span class="lbl">history</span>
    <span class="meta">spin 2s</span>
  </div>

  <!-- SETTINGS -->
  <div class="tile">
    <div class="glow"></div>
    <div class="icon-wrap anim-set">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.65 1.65 0 0 0 15 19.4a1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09A1.65 1.65 0 0 0 15 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.36.16.71.36 1 .6"/>
      </svg>
    </div>
    <span class="lbl">settings</span>
    <span class="meta">gear · slow spin</span>
  </div>

  <!-- SPARKLES -->
  <div class="tile">
    <div class="glow"></div>
    <div class="icon-wrap anim-spark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/>
      </svg>
    </div>
    <span class="lbl">sparkles</span>
    <span class="meta">twinkle</span>
  </div>

  <!-- SEARCH -->
  <div class="tile">
    <div class="glow"></div>
    <div class="icon-wrap anim-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
    </div>
    <span class="lbl">search</span>
    <span class="meta">nudge</span>
  </div>
</div>

</body></html>
