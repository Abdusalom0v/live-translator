<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--color-bg); color: var(--fg-1); font-family: var(--font-sans); }
  .card { padding: 24px; display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box {
    background: var(--color-card);
    border: 1px solid var(--color-border-strong);
    width: 64px; height: 64px;
  }
  .lbl { font-family: var(--font-mono); font-size: 11px; color: var(--fg-3); }
  .lbl b { color: var(--fg-1); font-weight: 600; }
</style>
</head><body>
<div class="card">
  <div class="item"><div class="box" style="border-radius:4px"></div><div class="lbl"><b>r-xs</b> 4</div></div>
  <div class="item"><div class="box" style="border-radius:8px"></div><div class="lbl"><b>r-sm</b> 8</div></div>
  <div class="item"><div class="box" style="border-radius:12px"></div><div class="lbl"><b>r-md</b> 12</div></div>
  <div class="item"><div class="box" style="border-radius:16px"></div><div class="lbl"><b>r-lg</b> 16</div></div>
  <div class="item"><div class="box" style="border-radius:24px"></div><div class="lbl"><b>r-xl</b> 24</div></div>
  <div class="item"><div class="box" style="border-radius:999px; height:48px; width:120px"></div><div class="lbl"><b>r-pill</b></div></div>
  <div class="item"><div class="box" style="border-radius:50%"></div><div class="lbl"><b>r-circle</b></div></div>
</div>
</body></html>
