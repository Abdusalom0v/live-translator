<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../ui_kits/app/app.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--color-bg); color: var(--fg-1); font-family: var(--font-sans); }
  .card {
    padding: 24px;
    display: grid;
    grid-template-columns: 1.4fr 1fr 1fr;
    gap: 18px;
    align-items: stretch;
  }
  .tile {
    background: var(--color-card);
    border: 1px solid var(--color-border);
    border-radius: 14px;
    padding: 18px;
    display: flex; flex-direction: column;
    box-shadow: var(--shadow-card);
  }
  .head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .head .lbl {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--fg-3);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 600;
  }
  .meta {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--fg-4);
    letter-spacing: 0.06em;
  }

  .body {
    flex: 1;
    display: grid; place-items: center;
    min-height: 120px;
    padding: 8px 0;
  }
  .foot {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--color-divider);
  }
  .foot .name {
    font-size: 13px; font-weight: 600;
  }
  .foot .desc {
    font-size: 11px; color: var(--fg-3);
  }

  /* "live" dot + amplitude readout */
  .amp {
    display: flex; align-items: center; gap: 6px;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--color-success);
    letter-spacing: 0.04em;
  }
  .amp .ledot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--color-success);
    box-shadow: 0 0 6px var(--color-success);
    animation: lt-pulse 1.4s ease-in-out infinite;
  }

  /* ============== Flowing wave (Siri-like) ============== */
  .wave-svg { width: 100%; height: 110px; display: block; }
  .wave-svg path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .wave-svg path.w1 { stroke: #7F77DD; stroke-width: 2.4; opacity: 0.95; }
  .wave-svg path.w2 { stroke: #5BA8E0; stroke-width: 2.0; opacity: 0.80; }
  .wave-svg path.w3 { stroke: #1D9E75; stroke-width: 1.6; opacity: 0.55; }
  .wave-svg .glow { filter: url(#glow); }

  /* ============== Bar waveform ============== */
  .bars {
    display: flex; align-items: center; justify-content: center;
    gap: 5px;
    height: 88px;
  }
  .bars .bar {
    width: 4px;
    background: linear-gradient(180deg, #7F77DD 0%, #5BA8E0 100%);
    border-radius: 999px;
    will-change: transform;
    transform-origin: center;
    box-shadow: 0 0 8px rgba(127,119,221,0.4);
  }

  /* ============== Constellation (orbiting dots) ============== */
  .const {
    width: 110px; height: 110px;
    position: relative;
  }
  .const .core {
    position: absolute; left: 50%; top: 50%;
    width: 14px; height: 14px;
    margin: -7px;
    border-radius: 50%;
    background: #7F77DD;
    box-shadow: 0 0 20px rgba(127,119,221,0.7);
    will-change: transform;
  }
  .const .ring {
    position: absolute; inset: 0;
    border-radius: 50%;
    border: 1px solid rgba(127,119,221,0.18);
  }
  .const .ring.r2 { inset: -16px; border-color: rgba(127,119,221,0.10); }
  .const .dot {
    position: absolute; left: 50%; top: 50%;
    width: 6px; height: 6px;
    margin: -3px;
    border-radius: 50%;
    will-change: transform, opacity;
  }
  .const .dot.v { background: #7F77DD; box-shadow: 0 0 8px #7F77DD; }
  .const .dot.b { background: #5BA8E0; box-shadow: 0 0 8px #5BA8E0; }
  .const .dot.g { background: #1D9E75; box-shadow: 0 0 8px #1D9E75; }

  /* Big-tile state pill */
  .state-tabs {
    display: inline-flex;
    padding: 3px; gap: 2px;
    background: rgba(20,20,46,0.55);
    border: 1px solid var(--color-border);
    border-radius: 999px;
  }
  .state-tabs button {
    font: inherit;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--fg-3);
    background: transparent; border: none;
    padding: 4px 9px;
    border-radius: 999px;
    cursor: pointer;
  }
  .state-tabs button:hover { color: var(--fg-1); }
  .state-tabs button[aria-pressed="true"] {
    background: var(--color-accent);
    color: #fff;
  }

  /* Loading dots — keep but make sequenced */
  .lt-dots-x {
    display: inline-flex; gap: 8px;
    align-items: center; justify-content: center;
  }
  .lt-dots-x span {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--color-accent);
    box-shadow: 0 0 12px var(--color-accent);
    animation: ltdx 1.4s ease-in-out infinite both;
  }
  .lt-dots-x span:nth-child(1) { animation-delay: 0s;    }
  .lt-dots-x span:nth-child(2) { animation-delay: 0.18s; }
  .lt-dots-x span:nth-child(3) { animation-delay: 0.36s; }
  @keyframes ltdx {
    0%, 80%, 100% { transform: scale(0.4); opacity: 0.35; }
    40%           { transform: scale(1);   opacity: 1;    }
  }
</style>
</head>
<body>

<div class="card">

  <!-- ========== FLOWING WAVE (Siri-inspired but distinct) ========== -->
  <div class="tile">
    <div class="head">
      <span class="lbl">Flowing wave · primary</span>
      <span class="amp" id="amp-readout"><span class="ledot"></span>amp 0.42</span>
    </div>

    <div class="body">
      <svg class="wave-svg" id="wave" viewBox="0 0 600 110" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2.5" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <linearGradient id="grad1" x1="0" x2="1">
            <stop offset="0"   stop-color="#7F77DD"/>
            <stop offset=".5"  stop-color="#9B91F2"/>
            <stop offset="1"   stop-color="#7F77DD"/>
          </linearGradient>
        </defs>
        <path class="w3 glow" id="w3" d="M0 55"/>
        <path class="w2 glow" id="w2" d="M0 55"/>
        <path class="w1 glow" id="w1" d="M0 55" stroke="url(#grad1)"/>
      </svg>
    </div>

    <div class="foot">
      <div>
        <div class="name">During speech</div>
        <div class="desc">3 stacked sine waves · independent phase &amp; amplitude · driven by simulated speech envelope</div>
      </div>
      <div class="state-tabs" role="tablist" id="state-tabs">
        <button data-state="idle"      aria-pressed="false">Idle</button>
        <button data-state="speaking"  aria-pressed="true">Speaking</button>
        <button data-state="thinking"  aria-pressed="false">Thinking</button>
      </div>
    </div>
  </div>

  <!-- ========== BAR WAVEFORM ========== -->
  <div class="tile">
    <div class="head">
      <span class="lbl">Bars · compact</span>
      <span class="meta">14 bars · 60fps</span>
    </div>
    <div class="body">
      <div class="bars" id="bars">
        <!-- 14 bars injected -->
      </div>
    </div>
    <div class="foot">
      <div class="name">In status bar</div>
      <div class="desc">amp-reactive</div>
    </div>
  </div>

  <!-- ========== CONSTELLATION + DOTS ========== -->
  <div class="tile">
    <div class="head">
      <span class="lbl">Orbit · processing</span>
      <span class="meta">core breathes · dots orbit</span>
    </div>
    <div class="body" style="flex-direction: column; gap: 14px;">
      <div class="const" id="const">
        <div class="ring r2"></div>
        <div class="ring"></div>
        <div class="core"></div>
        <div class="dot v"></div>
        <div class="dot b"></div>
        <div class="dot g"></div>
      </div>
      <div class="lt-dots-x" aria-label="Translating">
        <span></span><span></span><span></span>
      </div>
    </div>
    <div class="foot">
      <div class="name">Between speech &amp; translation</div>
      <div class="desc">3 colour dots</div>
    </div>
  </div>
</div>

<script>
(() => {
  // ===== Simulated speech envelope =====
  // A "voice" amplitude that wobbles like real speech:
  //   - Slow envelope (syllables / phrases)
  //   - Fast jitter (consonant burst)
  //   - Occasional silences
  // Output: amp ∈ [0, 1]
  let t = 0;
  let state = 'speaking';   // 'idle' | 'speaking' | 'thinking'
  let phaseOffsets = [0, Math.PI/3, Math.PI/1.5];

  const stateTabs = document.getElementById('state-tabs');
  stateTabs.addEventListener('click', e => {
    const btn = e.target.closest('button[data-state]');
    if (!btn) return;
    state = btn.dataset.state;
    [...stateTabs.querySelectorAll('button')].forEach(b => {
      b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
    });
  });

  function envelope(time) {
    if (state === 'idle')     return 0.06 + 0.04 * Math.sin(time * 0.001);
    if (state === 'thinking') return 0.20 + 0.05 * Math.sin(time * 0.004);
    // speaking: layered sines + fast jitter + silences
    const slow = 0.5 + 0.35 * Math.sin(time * 0.0008);
    const med  = 0.5 + 0.30 * Math.sin(time * 0.003 + 1.7);
    const fast = 0.5 + 0.45 * Math.sin(time * 0.012 + 3.3);
    let amp = (slow * 0.55 + med * 0.30 + fast * 0.35);
    // brief silences
    const silenceGate = (Math.sin(time * 0.0006) + 0.7);
    amp *= Math.max(0.15, Math.min(1, silenceGate));
    // clamp
    return Math.max(0.05, Math.min(1, amp));
  }

  // ===== Flowing wave (3 SVG paths) =====
  const w1 = document.getElementById('w1');
  const w2 = document.getElementById('w2');
  const w3 = document.getElementById('w3');
  const ampReadout = document.getElementById('amp-readout');

  const WIDTH = 600;
  const HEIGHT = 110;
  const MID = HEIGHT / 2;
  const SAMPLES = 64;

  function wavePath(time, amp, phase, freq, base) {
    let d = '';
    for (let i = 0; i <= SAMPLES; i++) {
      const x = (i / SAMPLES) * WIDTH;
      // Window so wave fades at edges (envelope shape)
      const tau = i / SAMPLES;
      const window = Math.sin(tau * Math.PI); // 0 at edges, 1 in middle
      const y = MID
        + Math.sin(tau * Math.PI * freq + time * 0.005 + phase) * 22 * amp * window
        + Math.sin(tau * Math.PI * (freq * 1.7) - time * 0.003 + phase * 1.3) * 10 * amp * window;
      d += (i === 0 ? 'M ' : ' L ') + x.toFixed(1) + ' ' + y.toFixed(1);
    }
    return d;
  }

  // ===== Bars =====
  const barsEl = document.getElementById('bars');
  const BAR_COUNT = 14;
  for (let i = 0; i < BAR_COUNT; i++) {
    const b = document.createElement('span');
    b.className = 'bar';
    b.style.height = '60%';
    barsEl.appendChild(b);
  }
  const barEls = [...barsEl.querySelectorAll('.bar')];
  const barAmps = new Float32Array(BAR_COUNT);

  // ===== Constellation =====
  const constEl = document.getElementById('const');
  const constDots = [...constEl.querySelectorAll('.dot')];
  const core = constEl.querySelector('.core');

  // ===== Main RAF =====
  function frame() {
    t += 16;
    const amp = envelope(t);

    // Update wave paths
    w1.setAttribute('d', wavePath(t, amp,           0,   5, MID));
    w2.setAttribute('d', wavePath(t, amp * 0.78,  1.2,   7, MID));
    w3.setAttribute('d', wavePath(t, amp * 0.55,  2.4,   9, MID));

    // Update bars — each bar has its own slight phase offset, so they ripple
    for (let i = 0; i < BAR_COUNT; i++) {
      const phase = i / BAR_COUNT * Math.PI * 2;
      const local = 0.5 + 0.5 * Math.sin(t * 0.008 + phase * 1.5);
      // Bell envelope so middle bars are taller
      const bell = Math.sin((i + 0.5) / BAR_COUNT * Math.PI);
      const target = (0.18 + local * 0.82) * amp * (0.6 + bell * 0.6);
      barAmps[i] += (target - barAmps[i]) * 0.25;
      const h = Math.max(0.1, Math.min(1, barAmps[i]));
      barEls[i].style.height = (h * 100) + '%';
    }

    // Update readout
    ampReadout.lastChild.textContent = 'amp ' + amp.toFixed(2);

    // Update constellation — core scales with amp; dots orbit
    const coreScale = 0.7 + amp * 0.8;
    core.style.transform = `scale(${coreScale.toFixed(2)})`;
    const baseR = state === 'thinking' ? 40 : 32 + amp * 18;
    constDots.forEach((d, i) => {
      const speed = state === 'thinking' ? 0.005 : 0.003;
      const ang = t * speed + (i / 3) * Math.PI * 2;
      const r = baseR + Math.sin(t * 0.006 + i) * 6;
      const x = Math.cos(ang) * r;
      const y = Math.sin(ang) * r;
      d.style.transform = `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, 0)`;
      d.style.opacity   = (0.55 + 0.45 * Math.abs(Math.sin(ang))).toFixed(2);
    });

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body></html>
