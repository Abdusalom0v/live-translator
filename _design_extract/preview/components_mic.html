<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../ui_kits/app/app.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--color-bg); color: var(--fg-1); font-family: var(--font-sans); }
  .card { padding: 28px; display: flex; gap: 32px; align-items: center; justify-content: space-around; }
  .item { text-align: center; }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); display: block; text-align: center; margin-top: 16px; letter-spacing: 0.06em; text-transform: uppercase; }
  .micwrap { position: relative; width: 80px; height: 80px; display: grid; place-items: center; }
  svg.mic { width: 42%; height: 42%; }
</style>
</head><body>
<div class="card">
  <div class="item">
    <div class="micwrap">
      <button type="button" class="lt-mic lt-mic--idle" style="width:64px;height:64px">
        <span class="lt-mic__inner"><svg class="mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></svg></span>
      </button>
    </div>
    <span class="lbl">Idle</span>
  </div>
  <div class="item">
    <div class="micwrap">
      <button type="button" class="lt-mic lt-mic--listening" style="width:64px;height:64px">
        <span class="lt-mic__ring"></span><span class="lt-mic__ring"></span><span class="lt-mic__ring"></span>
        <span class="lt-mic__inner"><svg class="mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></svg></span>
      </button>
    </div>
    <span class="lbl">Listening</span>
  </div>
  <div class="item">
    <div class="micwrap">
      <button type="button" class="lt-mic lt-mic--processing" style="width:64px;height:64px">
        <span class="lt-mic__inner"><svg class="mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></svg></span>
      </button>
    </div>
    <span class="lbl">Processing</span>
  </div>
  <div class="item">
    <div class="micwrap">
      <button type="button" class="lt-mic lt-mic--error" style="width:64px;height:64px; animation: none">
        <span class="lt-mic__inner"><svg class="mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></svg></span>
      </button>
    </div>
    <span class="lbl">Error</span>
  </div>
</div>
</body></html>
