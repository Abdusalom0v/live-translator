<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="../ui_kits/app/app.css">
<style>
  html, body { margin: 0; padding: 0; background: var(--color-bg); color: var(--fg-1); font-family: var(--font-sans); }
  .card { padding: 24px; display: flex; flex-direction: column; gap: 18px; }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--fg-3); margin-bottom: 6px; letter-spacing: 0.06em; text-transform: uppercase; display:block; }
</style>
</head><body>
<div class="card">
  <div>
    <span class="lbl">Language bar</span>
    <div class="lt-langbar" style="border:1px solid var(--color-border); border-radius: 12px; height:auto; padding: 8px 16px;">
      <button class="lt-lang"><span class="lt-lang__flag">🇬🇧</span>English<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></button>
      <button class="lt-lang__swap" aria-label="Swap">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 16V4M7 4 3 8M7 4l4 4"/><path d="M17 8v12M17 20l4-4M17 20l-4-4"/></svg>
      </button>
      <button class="lt-lang lt-lang--right"><span class="lt-lang__flag">🇺🇿</span>O'zbekcha<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></button>
    </div>
  </div>
  <div>
    <span class="lbl">Status bar</span>
    <div class="lt-statusbar" style="border:1px solid var(--color-border); border-radius: 12px;">
      <span class="lt-status-rec"><span class="lt-status-rec__dot"></span>Yozilmoqda</span>
      <span class="lt-status-latency">~1.2s</span>
      <span class="lt-status-latency" style="color: var(--fg-3)">4 chunks · 28s</span>
      <div class="lt-statusbar__spacer"></div>
      <button class="lt-save-btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>Saqlash</button>
    </div>
  </div>
</div>
</body></html>
