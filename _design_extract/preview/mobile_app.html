<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LiveTranslate — Mobile</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  /* Dedicated mobile mockup — sized for a 360-wide viewport.
     Renders inside an iframe in components_app.html. */

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    background: var(--color-bg);
    color: var(--fg-1);
    font-family: var(--font-sans);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Background orbs — calm, distant */
  .bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .bg::before {
    content: '';
    position: absolute;
    width: 280px; height: 280px;
    top: -60px; left: -80px;
    background: #7F77DD;
    opacity: 0.18;
    filter: blur(70px);
    border-radius: 50%;
    animation: drift 28s ease-in-out infinite;
  }
  .bg::after {
    content: '';
    position: absolute;
    width: 240px; height: 240px;
    bottom: -60px; right: -60px;
    background: #1D9E75;
    opacity: 0.12;
    filter: blur(70px);
    border-radius: 50%;
    animation: drift 36s ease-in-out infinite reverse;
  }
  @keyframes drift { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(40px,30px) scale(1.05);} }

  .app {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    height: 100vh;
  }

  /* --- iOS-style status bar --- */
  .ios-status {
    height: 44px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px;
    font-family: -apple-system, 'SF Pro Text', var(--font-sans);
    font-size: 15px;
    font-weight: 600;
    color: var(--fg-1);
    letter-spacing: -0.01em;
  }
  .ios-status .right {
    display: flex; align-items: center; gap: 6px;
  }
  .ios-icon {
    height: 11px;
  }

  /* --- Header --- */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 16px 12px;
  }
  .logo {
    display: flex; align-items: center; gap: 10px;
    font-size: 17px; font-weight: 600;
    letter-spacing: -0.01em;
  }
  .logo .mark {
    width: 32px; height: 32px;
    border-radius: 9px;
    background: linear-gradient(135deg, #7F77DD, #5048A8);
    box-shadow: 0 6px 16px rgba(127,119,221,0.4);
    display: grid; place-items: center;
    color: #fff;
    position: relative;
    overflow: hidden;
  }
  .logo .mark::after {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(circle at 30% 25%, rgba(255,255,255,0.20), transparent 55%);
  }
  .logo .mark svg { position: relative; z-index: 1; }
  .header .actions { display: flex; gap: 4px; }
  .icon-btn {
    width: 36px; height: 36px;
    border: none; background: transparent;
    color: var(--fg-2);
    border-radius: 10px;
    display: grid; place-items: center;
  }
  .icon-btn:active { background: var(--color-card-hover); color: var(--fg-1); }

  /* --- Language bar --- */
  .langbar {
    display: grid; grid-template-columns: 1fr auto 1fr;
    gap: 8px; align-items: center;
    padding: 4px 16px 12px;
  }
  .lang {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 10px;
    border-radius: 999px;
    background: var(--color-card);
    border: 1px solid var(--color-border);
    font-size: 14px; font-weight: 600;
    color: var(--fg-1);
  }
  .lang .flag {
    font-size: 16px;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    display: grid; place-items: center;
  }
  .lang .name { font-size: 13px; }
  .lang .chev { color: var(--fg-3); }
  .swap {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--color-accent-soft);
    color: var(--color-accent);
    border: none;
    display: grid; place-items: center;
  }

  /* --- Tab bar --- */
  .tabs {
    display: flex; gap: 4px;
    padding: 4px;
    margin: 0 16px;
    border-radius: 12px;
    background: rgba(20, 20, 46, 0.5);
    border: 1px solid var(--color-border);
  }
  .tabs button {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--fg-2);
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 9px;
    border-radius: 9px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .tabs button[aria-pressed="true"] {
    background: var(--color-accent);
    color: var(--fg-on-accent);
    box-shadow: 0 4px 12px rgba(127,119,221,0.35);
  }
  .tabs button .flag {
    font-size: 14px;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: rgba(255,255,255,0.10);
    display: inline-grid; place-items: center;
  }

  /* --- Transcript --- */
  .panel {
    flex: 1;
    overflow-y: auto;
    padding: 16px 16px 12px;
    position: relative;
    min-height: 0;
  }
  .panel::before {
    content: '';
    position: sticky;
    display: block;
    top: 0;
    height: 24px;
    margin-bottom: -24px;
    background: linear-gradient(to bottom, var(--color-bg) 0%, transparent 100%);
    z-index: 2;
  }
  .chunk {
    padding: 12px 14px;
    border-radius: 12px;
    margin-bottom: 10px;
    background: rgba(42,42,74,0.55);
    border: 1px solid rgba(127,119,221,0.10);
  }
  .chunk .time {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--fg-3);
    letter-spacing: 0.04em;
    margin-bottom: 4px;
    display: block;
  }
  .chunk .text {
    font-size: 15px;
    line-height: 1.55;
    color: var(--fg-1);
  }
  .chunk.active {
    border-color: var(--color-accent);
    background: rgba(127,119,221,0.10);
  }
  .chunk.active .text::after {
    content: '';
    display: inline-block;
    width: 2px; height: 1em;
    background: var(--color-accent);
    margin-left: 3px;
    vertical-align: text-bottom;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 0%,49%{opacity:1;} 50%,100%{opacity:0;} }

  /* --- Controls --- */
  .controls {
    display: flex; align-items: center; justify-content: center;
    gap: 14px;
    padding: 14px 16px 8px;
    border-top: 1px solid var(--color-divider);
    background: rgba(42,42,74,0.40);
    backdrop-filter: blur(12px);
  }
  .mic {
    position: relative;
    width: 60px; height: 60px;
    border-radius: 50%;
    background: var(--color-accent);
    color: #fff;
    border: none;
    box-shadow:
      0 8px 24px rgba(127,119,221,0.55),
      0 0 0 0 rgba(127,119,221,0.40);
    display: grid; place-items: center;
    animation: mic-glow 1.8s ease-in-out infinite;
  }
  @keyframes mic-glow {
    0%, 100% { box-shadow: 0 8px 24px rgba(127,119,221,0.55), 0 0 0 0 rgba(127,119,221,0.45); }
    50%      { box-shadow: 0 8px 24px rgba(127,119,221,0.55), 0 0 0 14px rgba(127,119,221,0); }
  }
  .mic::before {
    content: '';
    position: absolute; inset: 0;
    border-radius: 50%;
    border: 2px solid var(--color-accent);
    animation: mic-ripple 1.8s ease-out infinite;
  }
  @keyframes mic-ripple {
    0%   { transform: scale(1);   opacity: 0.5; }
    100% { transform: scale(1.6); opacity: 0;   }
  }
  .mic svg { width: 26px; height: 26px; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.1);} }

  .wave {
    display: block;
    width: 96px;
    height: 36px;
    filter: drop-shadow(0 0 6px rgba(127,119,221,0.35));
  }
  .wave path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .wave .p1 { stroke-width: 2.2; opacity: 0.95; }
  .wave .p2 { stroke: #5BA8E0; stroke-width: 1.8; opacity: 0.80; }
  .wave .p3 { stroke: #1D9E75; stroke-width: 1.4; opacity: 0.55; }

  .small-btn {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--color-card);
    border: 1px solid var(--color-border);
    color: var(--fg-1);
    display: grid; place-items: center;
  }

  /* --- Status bar --- */
  .status {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px 18px;
    font-size: 12px;
  }
  .status .rec {
    display: flex; align-items: center; gap: 6px;
    color: var(--color-error);
    font-weight: 600;
  }
  .status .rec .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--color-error);
    box-shadow: 0 0 8px var(--color-error);
    animation: pulse-dot 1.4s ease-in-out infinite;
  }
  @keyframes pulse-dot { 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:0.6; transform:scale(1.2);} }
  .status .lat {
    font-family: var(--font-mono);
    color: var(--fg-3);
  }
  .status .save {
    background: transparent; border: none; color: var(--color-accent);
    font-weight: 600; font-size: 13px;
    display: inline-flex; align-items: center; gap: 6px;
  }

  /* Home-bar */
  .home-bar {
    height: 5px;
    width: 130px;
    border-radius: 999px;
    background: rgba(245,245,247,0.6);
    margin: 0 auto 8px;
  }
</style>
</head>
<body>
<div class="bg"></div>

<div class="app">

  <!-- iOS status bar -->
  <div class="ios-status">
    <span>9:41</span>
    <div class="right">
      <!-- signal -->
      <svg class="ios-icon" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8"  width="3" height="4" rx="0.5"/><rect x="5" y="6"  width="3" height="6" rx="0.5"/><rect x="10" y="3" width="3" height="9" rx="0.5"/><rect x="15" y="0" width="3" height="12" rx="0.5"/></svg>
      <!-- wifi -->
      <svg class="ios-icon" viewBox="0 0 15 11" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1 4.5a10 10 0 0 1 13 0M3 7a6 6 0 0 1 9 0"/><circle cx="7.5" cy="9" r="1" fill="currentColor"/></svg>
      <!-- battery -->
      <svg class="ios-icon" viewBox="0 0 27 12" fill="none" stroke="currentColor" stroke-width="1"><rect x="0.5" y="0.5" width="22" height="11" rx="2.5"/><rect x="2" y="2" width="19" height="8" rx="1.5" fill="currentColor"/><rect x="24" y="3.5" width="2" height="5" rx="1" fill="currentColor"/></svg>
    </div>
  </div>

  <!-- Header -->
  <div class="header">
    <div class="logo">
      <span class="mark">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2" width="6" height="12" rx="3"/>
          <path d="M5 10v2a7 7 0 0 0 14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="22"/>
          <line x1="8" y1="22" x2="16" y2="22"/>
        </svg>
      </span>
      LiveTranslate
    </div>
    <div class="actions">
      <button class="icon-btn" aria-label="History">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>
      </button>
      <button class="icon-btn" aria-label="Settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.65 1.65 0 0 0 15 19.4a1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09A1.65 1.65 0 0 0 15 4.6"/></svg>
      </button>
    </div>
  </div>

  <!-- Language bar -->
  <div class="langbar">
    <button class="lang">
      <span class="flag">🇬🇧</span>
      <span class="name">EN</span>
    </button>
    <button class="swap" aria-label="Swap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 16V4M7 4 3 8M7 4l4 4"/><path d="M17 8v12M17 20l4-4M17 20l-4-4"/></svg>
    </button>
    <button class="lang">
      <span class="flag">🇺🇿</span>
      <span class="name">UZ</span>
    </button>
  </div>

  <!-- Tabs -->
  <div class="tabs" role="tablist">
    <button aria-pressed="false">
      <span class="flag">🇬🇧</span>
      Original
    </button>
    <button aria-pressed="true">
      <span class="flag">🇺🇿</span>
      Tarjima
    </button>
  </div>

  <!-- Transcript -->
  <div class="panel">
    <div class="chunk">
      <span class="time">14:21</span>
      <div class="text">Bugun fotosintez haqida gaplashamiz.</div>
    </div>
    <div class="chunk">
      <span class="time">14:22</span>
      <div class="text">O'simliklar havodan karbonat angidridni oladi.</div>
    </div>
    <div class="chunk active">
      <span class="time">14:23</span>
      <div class="text">Yashil pigment xlorofil deb ataladi</div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="small-btn" aria-label="Headphones">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1v-7h3v5ZM3 19a2 2 0 0 0 2 2h1v-7H3v5Z"/></svg>
    </button>
    <button class="mic" aria-label="Listening">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></svg>
    </button>
    <div class="wave" aria-hidden="true">
      <svg viewBox="0 0 200 36" preserveAspectRatio="none" style="width:100%; height:100%">
        <defs>
          <linearGradient id="m-grad" x1="0" x2="1">
            <stop offset="0"  stop-color="#7F77DD"/>
            <stop offset=".5" stop-color="#9B91F2"/>
            <stop offset="1"  stop-color="#7F77DD"/>
          </linearGradient>
        </defs>
        <path class="p3" id="m-w3" d="M0 18"></path>
        <path class="p2" id="m-w2" d="M0 18"></path>
        <path class="p1" id="m-w1" d="M0 18" stroke="url(#m-grad)"></path>
      </svg>
    </div>
  </div>

  <!-- Status -->
  <div class="status">
    <span class="rec"><span class="dot"></span>Yozilmoqda</span>
    <span class="lat">~1.2s</span>
    <button class="save">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      Saqlash
    </button>
  </div>

  <div class="home-bar"></div>
</div>

<script>
(() => {
  const w1 = document.getElementById('m-w1');
  const w2 = document.getElementById('m-w2');
  const w3 = document.getElementById('m-w3');
  if (!w1) return;
  const WIDTH = 200, HEIGHT = 36, MID = HEIGHT / 2, SAMPLES = 48;
  let t = 0;
  function env(time) {
    const slow = 0.5 + 0.35 * Math.sin(time * 0.0008);
    const med  = 0.5 + 0.30 * Math.sin(time * 0.003 + 1.7);
    const fast = 0.5 + 0.45 * Math.sin(time * 0.012 + 3.3);
    let a = slow * 0.55 + med * 0.30 + fast * 0.35;
    const gate = (Math.sin(time * 0.0006) + 0.7);
    a *= Math.max(0.15, Math.min(1, gate));
    return Math.max(0.08, Math.min(1, a));
  }
  function path(time, amp, phase, freq) {
    let d = '';
    for (let i = 0; i <= SAMPLES; i++) {
      const x = (i / SAMPLES) * WIDTH;
      const tau = i / SAMPLES;
      const win = Math.sin(tau * Math.PI);
      const y = MID
        + Math.sin(tau * Math.PI * freq + time * 0.005 + phase) * 9 * amp * win
        + Math.sin(tau * Math.PI * (freq * 1.7) - time * 0.003 + phase * 1.3) * 4.5 * amp * win;
      d += (i === 0 ? 'M ' : ' L ') + x.toFixed(1) + ' ' + y.toFixed(1);
    }
    return d;
  }
  function tick() {
    t += 16;
    const a = env(t);
    w1.setAttribute('d', path(t, a,         0,   5));
    w2.setAttribute('d', path(t, a * 0.78,  1.2, 7));
    w3.setAttribute('d', path(t, a * 0.55,  2.4, 9));
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
